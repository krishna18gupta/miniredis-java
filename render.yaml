# ==============================================================================
# Render Blueprint Specification for MiniRedis Free Web Service
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: miniredis-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MINIREDIS_DEMO_MODE
        value: "true"
      - key: MINIREDIS_CORS_ORIGIN
        value: "https://miniredis-java.pages.dev"
