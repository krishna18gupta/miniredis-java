# ==============================================================================
# MiniRedis Nginx Reverse Proxy & Security Configuration
# Routes HTTPS traffic to internal port 8080 while shielding port 6379 from web
# ==============================================================================

# Rate limiting zone: max 30 requests/second per IP with a burst of 20
limit_req_zone $binary_remote_addr zone=miniredis_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.miniredis.example.com; # Replace with your real domain or IP

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.miniredis.example.com;

    # SSL Certificates (managed via Certbot or custom certificate)
    # ssl_certificate /etc/letsencrypt/live/api.miniredis.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.miniredis.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum client payload size (protect against huge write attacks)
    client_max_body_size 2M;

    # Health check endpoint (bypasses rate limit for uptime monitoring)
    location = /api/health {
        proxy_pass http://127.0.0.1:8080/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API & Web Console Proxy
    location / {
        limit_req zone=miniredis_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade headers (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
