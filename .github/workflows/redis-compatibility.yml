name: Redis 7.2 Live Compatibility & Differential Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  redis-7-2-differential:
    name: Redis 7.2 Live Reference Verification
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Redis Driver
        run: pip install redis==8.1.0

      - name: Verify Redis 7.2 Reference Service Health & Version
        run: |
          echo "Probing reference Redis 7.2 service on 127.0.0.1:6380..."
          redis-cli -p 6380 ping
          echo "=============================================="
          echo "Reference Redis Server Details:"
          redis-cli -p 6380 info server | grep -E "redis_version|redis_mode|os|tcp_port"
          echo "=============================================="

      - name: Run Differential Tests (FORCED LIVE_REFERENCE_MODE)
        run: |
          mvn test \
            -Dredis.ref.mode=LIVE_REFERENCE \
            -Dredis.ref.host=127.0.0.1 \
            -Dredis.ref.port=6380 \
            --batch-mode

      - name: Build Executable MiniRedis JAR
        run: mvn package -DskipTests --batch-mode

      - name: Verify Python redis-py Client Interoperability
        run: |
          echo "Starting MiniRedis background server on port 6379..."
          java -jar target/miniredis-java-1.0.0.jar --port 6379 --web-port 8089 &
          MINIREDIS_PID=$!
          sleep 2
          echo "Running redis-py interoperability test suite..."
          python src/test/python/test_redis_py_interop.py 6379 127.0.0.1
          kill $MINIREDIS_PID

      - name: Set up Node.js 20 (Website Build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Verify Website Production Build
        run: |
          cd website
          npm ci
          npm run build
