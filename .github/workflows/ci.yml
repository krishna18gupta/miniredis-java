name: MiniRedis CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Test Suite
        run: mvn clean test --batch-mode

      - name: Build Executable JAR
        run: mvn package -DskipTests --batch-mode

      - name: Archive Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniredis-executable-jar
          path: target/miniredis-java-*.jar
          if-no-files-found: error

      - name: Set up Node.js 20 (Website Build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Verify Website Production Build
        run: |
          cd website
          npm ci
          npm run build
